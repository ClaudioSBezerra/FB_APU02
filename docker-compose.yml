services:
  # Backend (Go)
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    expose:
      - "8081"
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-fb_apu}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - APP_MODULE=${APP_MODULE:-apuracao}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://apuracao.fbtax.cloud}
      - IAM_BASE_URL=${IAM_BASE_URL}
      - IAM_ALLOWED_CLIENT_IDS=${IAM_ALLOWED_CLIENT_IDS}
      - IAM_CLIENT_ID=${IAM_CLIENT_ID}
      - IAM_REDIRECT_URI=${IAM_REDIRECT_URI}
      - IAM_SCOPES=${IAM_SCOPES}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
    networks:
      fb_net:
        aliases:
          - apu02-api

  # Frontend (React/Nginx) — label Traefik restrito a fctax.fcxlabs.com
  # (22/10): esse domínio é administrado pela equipe de Segurança da
  # Ferreira Costa (AWS), fora do nosso controle — continua exposto direto
  # até eles migrarem pro Cloudflare. apuracao.fbtax.cloud (nosso domínio)
  # saiu daqui porque já está 100% no Cloudflare Tunnel desde 21/10.
  web:
    build:
      context: ./frontend
      args:
        - VITE_APP_MODULE=${VITE_APP_MODULE:-apuracao}
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.apuracao.rule=Host(`fctax.fcxlabs.com`)"
      - "traefik.http.routers.apuracao.entrypoints=https"
      - "traefik.http.routers.apuracao.tls=true"
      - "traefik.http.routers.apuracao.tls.certresolver=letsencrypt"
      - "traefik.http.services.apuracao.loadbalancer.server.port=80"
    depends_on:
      - api
    networks:
      - fb_net
      - coolify

  # Banco de Dados
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-fb_apu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fb_net    # NUNCA adicionar 'coolify' aqui: rede compartilhada entre stacks,
                  # hostname 'db' colide entre produtos (incidente 2026-07-01/04)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fb_apu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:alpine
    restart: always
    sysctls:
      - net.core.somaxconn=1024
    networks:
      - fb_net

  # Cloudflare Tunnel (21/10, ativado e validado em 22/10) — caminho público
  # pra apuracao.fbtax.cloud (rota no painel: hostname raiz -> http://web:80).
  # fctax.fcxlabs.com continua fora, via Traefik (ver comentário em `web`).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fb_apu02-cloudflared-prod
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - fb_net
    depends_on:
      - web

networks:
  fb_net:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data:
  api_uploads:
