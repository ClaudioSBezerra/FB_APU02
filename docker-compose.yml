services:
  # Backend (Go)
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: always
    expose:
      - "8081"
    environment:
      - PORT=8081
      - DATABASE_URL=postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-fb_apu}?sslmode=disable
      - REDIS_ADDR=redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - COOKIE_SECURE=${COOKIE_SECURE:-true}
      - APP_MODULE=${APP_MODULE:-apuracao}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - APP_URL=${APP_URL:-https://apuracao.fbtax.cloud}
      - IAM_BASE_URL=${IAM_BASE_URL}
      - IAM_ALLOWED_CLIENT_IDS=${IAM_ALLOWED_CLIENT_IDS}
      - IAM_CLIENT_ID=${IAM_CLIENT_ID}
      - IAM_REDIRECT_URI=${IAM_REDIRECT_URI}
      - IAM_SCOPES=${IAM_SCOPES}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - api_uploads:/root/uploads
    networks:
      fb_net:
        aliases:
          - apu02-api

  # Frontend (React/Nginx)
  web:
    build:
      context: ./frontend
      args:
        - VITE_APP_MODULE=${VITE_APP_MODULE:-apuracao}
    restart: always
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.apuracao.rule=Host(`apuracao.fbtax.cloud`) || Host(`fctax.fcxlabs.com`)"
      - "traefik.http.routers.apuracao.entrypoints=https"
      - "traefik.http.routers.apuracao.tls=true"
      - "traefik.http.routers.apuracao.tls.certresolver=letsencrypt"
      - "traefik.http.services.apuracao.loadbalancer.server.port=80"
    depends_on:
      - api
    networks:
      - fb_net
      - coolify

  # Banco de Dados
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_NAME:-fb_apu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - fb_net    # NUNCA adicionar 'coolify' aqui: rede compartilhada entre stacks,
                  # hostname 'db' colide entre produtos (incidente 2026-07-01/04)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-fb_apu}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:alpine
    restart: always
    sysctls:
      - net.core.somaxconn=1024
    networks:
      - fb_net

  # Cloudflare Tunnel (21/10, migração de segurança) — scaffold DORMENTE.
  # IMPORTANTE (21/10): este serviço só pode viver AQUI, em docker-compose.yml
  # — não em docker-compose.prod.yml, que o Coolify NÃO usa (mesmo achado do
  # FB_FAROL, confirmado por log de deploy real: só os serviços deste
  # arquivo aparecem buildados/rodando). Sem CLOUDFLARE_TUNNEL_TOKEN setado
  # no Coolify, este container só reinicia sozinho, sem afetar os demais.
  #
  # Passo a passo (manual, painel Cloudflare):
  #   1. Zero Trust -> Networks -> Tunnels -> Create a tunnel, nome ex.
  #      "fb-apu02-prod".
  #   2. Copiar o token gerado e setar CLOUDFLARE_TUNNEL_TOKEN no Coolify.
  #   3. Public Hostname/Route: Subdomain=apuracao, Domain=fbtax.cloud,
  #      Service=http://web:80.
  #   4. Apagar o registro DNS A antigo de apuracao.fbtax.cloud ANTES de
  #      criar a rota (senão o Cloudflare não cria o CNAME do túnel sozinho
  #      — erro 1016 "Origin DNS error" se isso já tiver acontecido; aí só
  #      criar o CNAME manual pra <tunnel-id>.cfargotunnel.com).
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: fb_apu02-cloudflared-prod
    restart: always
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - fb_net
    depends_on:
      - web

networks:
  fb_net:
    driver: bridge
  coolify:
    external: true

volumes:
  postgres_data:
  api_uploads:
