upstream backend {
    # Alias único apu02-api evita colisão de DNS com outros stacks (APU01, APU04, etc)
    # que também têm services chamados "api" e expõem na rede coolify compartilhada.
    server apu02-api:8081;
}

server {
    listen 80;
    client_max_body_size 2048M;

    # Headers de segurança (21/10, migração de segurança) — nenhum estava
    # configurado antes. Nenhuma location abaixo tem add_header próprio,
    # então herdam normalmente daqui (diferente do FB_FAROL/FB_SMARTPICK,
    # que têm add_header por location e exigiram duplicata explícita).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Aumentar timeouts para evitar 504 em processamentos longos ou inicialização lenta
        proxy_connect_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;

        # OTIMIZAÇÃO CRÍTICA PARA UPLOAD DE ARQUIVOS GRANDES:
        proxy_request_buffering off;
        proxy_http_version 1.1;
        client_body_timeout 1200s;
    }
}